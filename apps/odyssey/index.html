<!doctype html>
<html lang="he" dir="rtl">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="לפני המפלגה, הפלגה. לפני הדגל, מצפן. כלי משחקי לפיתוח קול אזרחי."
		/>
		<link rel="canonical" href="https://odyssey.democracynowanew.com/" />

		<!-- Link previews (WhatsApp, Facebook, Telegram, LinkedIn). The image is the
		     Wix original resized to 1200x630 JPEG (~200KB): WhatsApp drops previews
		     whose image is too heavy, and the original PNG is ~4MB. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="אודיסיאה ישראלית" />
		<meta property="og:locale" content="he_IL" />
		<meta property="og:locale:alternate" content="en_US" />
		<meta property="og:locale:alternate" content="ar_AR" />
		<meta property="og:url" content="https://odyssey.democracynowanew.com/" />
		<meta property="og:title" content="אודיסיאה ישראלית" />
		<meta
			property="og:description"
			content="מסע ומשא לארץ ישנה־חדשה. לפני המפלגה, הפלגה. לפני הדגל, מצפן."
		/>
		<meta
			property="og:image"
			content="https://static.wixstatic.com/media/a62535_6fb3242aca6a426db3ec017be8f0225a~mv2.png/v1/fill/w_1200,h_630,al_c,q_85,enc_jpg/odyssey-og.jpg"
		/>
		<meta property="og:image:type" content="image/jpeg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="אודיסיאה ישראלית — מסע ומשא לארץ ישנה־חדשה" />

		<!-- X / Twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="אודיסיאה ישראלית" />
		<meta
			name="twitter:description"
			content="מסע ומשא לארץ ישנה־חדשה. לפני המפלגה, הפלגה. לפני הדגל, מצפן."
		/>
		<meta
			name="twitter:image"
			content="https://static.wixstatic.com/media/a62535_6fb3242aca6a426db3ec017be8f0225a~mv2.png/v1/fill/w_1200,h_630,al_c,q_85,enc_jpg/odyssey-og.jpg"
		/>
		<meta name="twitter:image:alt" content="אודיסיאה ישראלית — מסע ומשא לארץ ישנה־חדשה" />

		<link rel="icon" href="/assets/favicon.svg" />
		<title>אודיסיאה ישראלית — מסע ומשא לארץ ישנה-חדשה</title>
		<!-- Language before first paint: same order as detectLang() in
		     src/i18n/i18n.ts (?lang=, saved choice, browser, Hebrew). Without it an
		     English visitor sees the page laid out right-to-left until React mounts. -->
		<script>
			(function () {
				var langs = ['he', 'en', 'ar'];
				var lang = new URLSearchParams(location.search).get('lang');
				if (langs.indexOf(lang) < 0) {
					try { lang = localStorage.getItem('odyssey_lang'); } catch (e) { lang = null; }
				}
				if (langs.indexOf(lang) < 0) {
					lang = 'he';
					var tags = navigator.languages || [navigator.language];
					for (var i = 0; i < tags.length; i++) {
						var p = String(tags[i]).slice(0, 2).toLowerCase();
						if (langs.indexOf(p) >= 0) { lang = p; break; }
					}
				}
				document.documentElement.lang = lang;
				document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
