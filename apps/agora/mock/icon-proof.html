<!doctype html><meta charset="utf-8"><title>icon proof</title>
<style>
 body{margin:0;padding:24px;font:13px/1.4 system-ui;background:#fff;color:#2b2350}
 .band{display:flex;gap:18px;align-items:center;padding:16px;border-radius:16px;margin-bottom:14px;flex-wrap:wrap}
 .p{background:linear-gradient(150deg,#a98cf7,#8b6bf0 45%,#5b39c9)}
 .w{background:#fff;border:1px solid rgba(83,60,160,.12)}
 .t{background:#f0ebfe}
 .i{background-image:url('./icons-sheet-alpha.png');background-repeat:no-repeat;background-size:300% 300%}
 .c0{background-position:0 0}.c1{background-position:50% 0}.c2{background-position:100% 0}
 .c3{background-position:0 50%}.c4{background-position:50% 50%}.c5{background-position:100% 50%}
 .c6{background-position:0 100%}.c7{background-position:50% 100%}.c8{background-position:100% 100%}
 .s24{width:24px;height:24px}.s32{width:32px;height:32px}.s44{width:44px;height:44px}.s64{width:64px;height:64px}.s96{width:96px;height:96px}
 h4{margin:18px 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#5f568a}
</style>
<h4>on purple — fringe test</h4>
<div class="band p">
 <i class="i c0 s96"></i><i class="i c1 s96"></i><i class="i c2 s96"></i><i class="i c5 s96"></i><i class="i c8 s96"></i>
</div>
<h4>on white</h4>
<div class="band w">
 <i class="i c0 s96"></i><i class="i c1 s96"></i><i class="i c2 s96"></i><i class="i c5 s96"></i><i class="i c8 s96"></i>
</div>
<h4>size ladder — 24 / 32 / 44 / 64 / 96 px</h4>
<div class="band w">
 <i class="i c2 s24"></i><i class="i c2 s32"></i><i class="i c2 s44"></i><i class="i c2 s64"></i><i class="i c2 s96"></i>
 <span style="width:20px"></span>
 <i class="i c5 s24"></i><i class="i c5 s32"></i><i class="i c5 s44"></i><i class="i c5 s64"></i><i class="i c5 s96"></i>
 <span style="width:20px"></span>
 <i class="i c0 s24"></i><i class="i c0 s32"></i><i class="i c0 s44"></i><i class="i c0 s64"></i><i class="i c0 s96"></i>
</div>
<h4>chip test — on the light tile</h4>
<div class="band t">
 <i class="i c2 s26" style="width:26px;height:26px"></i><i class="i c0 s26" style="width:26px;height:26px"></i>
</div>
