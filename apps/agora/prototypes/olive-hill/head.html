<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מבט וחיוך · בדיקת דמות</title><style>
*{box-sizing:border-box}body{margin:0;background:#202a2d;color:#f6eee1;font:17px Arial,sans-serif}canvas{display:block;width:100vw;height:100dvh;touch-action:none}header{position:fixed;top:25px;right:28px;max-width:380px;pointer-events:none}h1{font-size:25px;margin:0 0 8px}p{line-height:1.5;margin:0;color:#c6ceca}section{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 30px));padding:20px;background:#172023ec;border:1px solid #53625e;border-radius:16px;backdrop-filter:blur(12px)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}input{width:100%;margin:16px 0;accent-color:#e2b875}button{font:inherit;color:#f8efdf;background:#3b5351;border:1px solid #6c8580;padding:10px 15px;border-radius:8px;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #e2b875}small{font-size:14px;color:#c6ceca}#status{position:fixed;top:50%;width:100%;text-align:center;pointer-events:none}.note{position:fixed;left:25px;top:25px;font-size:14px;color:#c6ceca}@media(max-width:600px){header{right:18px;top:18px;max-width:260px}h1{font-size:21px}.note{top:100px;left:18px}section{bottom:12px;padding:14px}}
</style><canvas id="portrait" aria-label="ראש אישה מבוגרת בתלת־מימד עם הבעות פנים"></canvas><header><h1>מבט וחיוך</h1><p>ניסיון ראשון של הראש וההבעה</p></header><div class="note">גררו לסיבוב · גלגלת להתקרבות</div><div id="status" role="status">מכינים את התקריב…</div><section><div class="row"><label for="smile">עוצמת החיוך</label><output id="value">0%</output></div><input id="smile" type="range" min="0" max="100" value="0" aria-label="מעבר מהבעה רגועה לחיוך"><div class="row"><button id="play">לראות את החיוך</button><button id="blink">מצמוץ</button><button id="reset">מבט מלפנים</button></div><p style="margin-top:12px"><small>המודל ניתן לסיבוב. הדמיון לתמונה והטבעיות של ההבעה נמצאים בבדיקה.</small></p></section><script type="module" src="elder-head/viewer.js"></script></html>
