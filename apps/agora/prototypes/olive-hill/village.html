<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>סנהדרין · כפר החכמים</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#adc2b1;color:#fff7df}#world{position:fixed;inset:0;width:100%;height:100%;touch-action:none}header,footer,aside{position:fixed;z-index:2}header{top:24px;right:25px;left:25px;display:flex;justify-content:space-between;gap:15px;text-shadow:0 2px 6px #243e2c}h1{font-size:24px;margin:0}small{font-size:13px}button{font:inherit;cursor:pointer;border:1px solid #c5c6a2;background:#f6eed9;color:#304734;padding:11px 15px;border-radius:4px}button:focus-visible{outline:3px solid #e5a548;outline-offset:3px}header button{background:#304e40d9;color:#fff7df;font-size:13px}aside{right:25px;top:110px;background:#203e338c;padding:18px 22px;max-width:330px;border-right:3px solid #e3c388;backdrop-filter:blur(4px)}aside h2{font-size:23px;margin:10px 0}aside p{font-size:16px;line-height:1.65;margin:0}footer{bottom:24px;right:25px;left:25px;display:flex;gap:12px;justify-content:center}#enter{background:#35583d;color:#fff5df;border-color:#d2dcb1}#loading{position:fixed;inset:0;background:#345445;display:grid;place-items:center;z-index:10}[hidden]{display:none!important}#touch{position:fixed;left:20px;bottom:80px;z-index:2;display:none;gap:4px}#touch button{padding:13px}dialog{background:#fff7e3;color:#304734;border:2px solid #516d4b;max-width:480px;padding:28px;border-radius:8px;line-height:1.8}dialog::backdrop{background:#203e3388}.hint{position:fixed;bottom:80px;right:25px;font-size:13px;text-shadow:0 1px 4px #243e2c}#preview-label{position:fixed;bottom:125px;left:25px;font-size:12px;background:#264232bb;padding:7px;border-radius:3px}@media(pointer:coarse){#touch{display:flex}.hint{display:none}}@media(max-width:650px){header{right:15px;left:15px;top:15px}header h1{font-size:20px}header button{padding:8px;font-size:12px}aside{right:15px;top:85px;max-width:230px;padding:12px}aside h2{font-size:20px}#preview-label{bottom:210px}footer{left:15px;right:15px;bottom:15px}footer button{font-size:14px}}

#preview-info{width:min(760px,94vw);max-width:760px;padding:24px;background:#f3eddf}#encounter{display:flex;align-items:center;gap:24px}#guide-portrait{width:40%;max-height:65vh;object-fit:contain;filter:drop-shadow(0 8px 12px #30473420)}#encounter-copy{flex:1}#encounter-name{font-size:21px}#encounter-question{position:relative;background:white;border:2px solid #576951;border-radius:24px;padding:20px;font-size:22px;line-height:1.6;box-shadow:4px 5px 0 #ddd4bd}#guide-choices{display:flex;flex-wrap:wrap;gap:6px}#guide-choices button{font-size:14px;padding:8px}#encounter-note{font-size:13px;color:#62705c}@media(max-width:650px){#encounter{gap:12px}#guide-portrait{width:38%;max-height:48vh}#encounter-question{font-size:18px;padding:14px}#encounter-name{font-size:17px}#preview-info{padding:16px}}
.has-community aside{top:70px}
/* The app's bar sits across the foot of the world: the world's own controls lift above it. */
.has-community footer{bottom:96px}.has-community #touch{bottom:150px}.has-community .hint{bottom:96px}

#desk-bubble{position:fixed;z-index:3;width:min(340px,calc(100vw - 32px));transform:translate(-50%,-100%);background:#fffdf3;color:#304734;border:2px solid #40533e;border-radius:24px;padding:16px 20px;box-shadow:4px 5px 0 #344c3640;line-height:1.5}
#desk-bubble::after{content:"";position:absolute;bottom:-12px;left:calc(50% - 10px);width:20px;height:20px;background:#fffdf3;border-right:2px solid #40533e;border-bottom:2px solid #40533e;transform:rotate(45deg)}
#desk-bubble strong{font-size:14px}#desk-bubble h3{font-size:19px;line-height:1.4;margin:6px 0 0}#desk-bubble p{font-size:18px;margin:6px 0 12px}#desk-write{width:100%;background:#35583d;color:#fffdf3;border-radius:12px;font-weight:700;font-size:17px}body.has-desk-bubble aside,body.is-covered aside,body.is-covered footer{display:none}
@media(max-width:650px){#desk-bubble{width:245px;padding:12px 16px}#desk-bubble p{font-size:16px}#desk-write{padding:8px}}

/* The village map: a titled, collapsible list with a state per station. */
#station-map{position:fixed;z-index:3;left:25px;top:105px;width:280px;background:#203e33eb;border:1px solid #d4b67488;border-radius:14px;padding:6px;box-shadow:0 6px 20px #0003;backdrop-filter:blur(4px)}
#station-map:not(.is-open){width:auto}
#map-toggle{width:100%;display:flex;justify-content:space-between;gap:12px;background:transparent;color:#fff7df;border:0;text-align:right;font-weight:700;font-size:15px;padding:8px 10px}
#map-toggle::after{content:'▾'}#station-map:not(.is-open) #map-toggle::after{content:'◂'}
#station-map:not(.is-open) #map-body{display:none}
#map-mode{margin:0 10px 8px;font-size:12px;line-height:1.5;color:#e9dfc4}
#preview-stations{display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 380px);min-height:120px;overflow:auto;padding:2px}
.station{display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:8px;width:100%;text-align:right;font-size:14px;background:#f9f0dcf2;padding:9px 10px;border-radius:10px}
.station__name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.station__icon{text-align:center}
.station__badge{font-size:11px;padding:2px 8px;border-radius:999px;background:#dfe8d6;color:#2f4a33;white-space:nowrap}
.station__badge.is-now{background:#e5a548;color:#2d2410;font-weight:700}
.station__badge.is-locked{background:#d9d4c9;color:#5f5e57}
.station[aria-current="true"]{outline:3px solid #e5a548;outline-offset:1px}
.station:disabled{opacity:.7;cursor:not-allowed}
/* Led by the teacher: only where the class is. */
#class-pill{position:fixed;z-index:3;left:25px;top:105px;max-width:320px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;background:#203e33eb;color:#fff7df;border:1px solid #d4b674;border-radius:14px;padding:10px 14px;font-weight:700;font-size:15px;box-shadow:0 6px 20px #0003}
#class-pill small{flex-basis:100%;font-weight:400;font-size:12px;color:#e9dfc4}
/* A new station, or the teacher taking the class somewhere. */
#news{position:fixed;z-index:5;left:50%;top:20px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);background:#fff7e3;color:#304734;border:2px solid #e5a548;border-radius:14px;padding:10px 16px;font-weight:700;box-shadow:0 8px 24px #0004}
#news-go{background:#35583d;color:#fff5df;border-color:#35583d;padding:8px 12px;white-space:nowrap}
#travel{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.has-community #station-map,.has-community #class-pill{top:135px}
.has-community #news{top:130px}
@media(max-width:650px){
 #station-map,#class-pill{left:15px;top:80px}
 #station-map.is-open{width:min(280px,calc(100vw - 30px))}
 #preview-stations{max-height:38vh}
 .has-community aside{max-width:calc(100vw - 205px);padding:10px}
 .has-community aside h2{font-size:17px}
 .has-community aside p{font-size:14px}
 #class-pill{max-width:min(210px,calc(100vw - 280px));font-size:12px;padding:8px 10px}
 #class-pill small{display:none}
 #class-pill-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
 .has-community #station-map,.has-community #class-pill{top:70px}
 #news{top:auto;bottom:80px}.has-community #news{top:auto;bottom:160px}
 #travel{max-width:170px}
}
</style></head><body><canvas id="world" tabindex="0" aria-label="כפר חכמים תלת־מימדי בנוף ארץ ישראלי"></canvas><header><div><h1>סנהדרין</h1><small>כפר של שאלות טובות</small></div><div><a id="session-entry" href="/?world=village" style="color:#fff7df;background:#304e40;padding:11px 15px;border-radius:4px;display:inline-block;text-decoration:none">יצירת משחק / הצטרפות</a> <button id="sound">♫ צלילים</button> <button id="quality">איכות גבוהה</button></div></header><aside><small id="station-place"></small><h2 id="station-name"></h2><p id="guide-line"></p></aside><section id="station-map" aria-label="מפת הכפר"><button id="map-toggle" type="button" aria-expanded="true" aria-controls="map-body">🗺 מפת הכפר</button><div id="map-body"><p id="map-mode"></p><nav id="preview-stations" aria-label="תחנות בכפר"></nav></div></section><div id="class-pill" role="status" hidden><span aria-hidden="true">🧭</span><span id="class-pill-text"></span><small>המורה מוביל את הכיתה בין התחנות</small></div><div id="news" role="status" hidden><span id="news-text"></span><button id="news-go" type="button" hidden>ללכת לשם ←</button></div><div id="preview-label">סיור בכפר · הנתונים האמיתיים זמינים בתוך מפגש Agora</div><div class="hint">W A S D הליכה · גרירה להסתכלות · E כניסה</div><section id="desk-bubble" aria-label="הזמנה לכתיבה מהדמות" hidden><strong id="desk-speaker"></strong><h3 id="desk-question"></h3><p id="desk-invitation"></p><button id="desk-write">לכתוב על הפתק שלי</button></section><footer><button id="travel">ללכת לתחנה</button><button id="enter">להיכנס לתחנה ←</button></footer><div id="touch"><button data-key="KeyW" aria-label="קדימה">↑</button><button data-key="KeyA" aria-label="שמאלה">←</button><button data-key="KeyS" aria-label="אחורה">↓</button><button data-key="KeyD" aria-label="ימינה">→</button></div><div id="loading" role="status">פותחים את שערי הכפר…</div><dialog id="preview-info" aria-labelledby="encounter-name"><div id="encounter"><img id="guide-portrait" alt="" hidden><div id="encounter-copy"><h2 id="encounter-name"></h2><p id="encounter-question"></p><div id="guide-choices" aria-label="חכמים בתחנה" hidden></div><p id="encounter-note">זהו סיור בכפר. בתוך מפגש Agora תיפתח כאן הפעילות שהמורה בחר, עם הכתיבה והדירוג של המפגש.</p><button id="close-info">חזרה לכפר</button></div></div></dialog><script type="module" src="world-scene.js"></script></body></html>
