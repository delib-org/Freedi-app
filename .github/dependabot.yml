# Weekly dependency updates, grouped so a week is a handful of PRs, not dozens.
# Only minor and patch bumps are grouped. Majors (Next.js, Sentry, firebase-admin)
# arrive as their own PR so each gets a deliberate review.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      root-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  # shared-types and the other @freedi packages are local .tgz files that the
  # functions prebuild step repacks; Dependabot leaves those alone.
  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      functions-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /apps/mass-consensus
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      mc-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /apps/sign
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      sign-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /apps/agora
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      agora-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /apps/join-class
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      join-class-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /apps/chat
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      chat-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /apps/studio
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      studio-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /apps/admin
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      admin-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /apps/flow
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      flow-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /apps/join
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      join-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /apps/tables
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      tables-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /apps/odyssey
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      odyssey-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
    labels: [dependencies]
