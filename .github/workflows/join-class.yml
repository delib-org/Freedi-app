name: Join Class

# WizCol Class (apps/join-class) is a copy of apps/join, and Join has no CI of
# its own, so this is the gate for the copy: lint, typecheck, unit tests, build.

on:
  pull_request:
    paths:
      - 'apps/join-class/**'
      - 'packages/shared-types/**'
      - '.github/workflows/join-class.yml'
  push:
    branches: [main, dev]
    paths:
      - 'apps/join-class/**'
      - 'packages/shared-types/**'
      - '.github/workflows/join-class.yml'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      # shared-types is a file: dependency compiled to dist/.
      - name: Build shared-types
        working-directory: ./packages/shared-types
        run: npm ci && npm run build

      # eslint and its config live at the repo root; the app finds them by
      # walking up the tree.
      - name: Install root toolchain
        run: npm ci

      # `npm ci` against the committed lockfile. apps/join-class/.npmrc sets
      # legacy-peer-deps because a plain resolve dies in npm's arborist
      # ("Cannot read properties of null (reading 'edgesOut')") on vitest's peer set.
      - name: Install Join Class
        working-directory: ./apps/join-class
        run: npm ci

      - name: Lint
        working-directory: ./apps/join-class
        run: npm run lint

      - name: Typecheck
        working-directory: ./apps/join-class
        run: npm run typecheck

      - name: Unit tests
        working-directory: ./apps/join-class
        run: npm test

      - name: Build
        working-directory: ./apps/join-class
        run: npm run build
