<!doctype html>
<html data-brand="wizcol" lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, maximum-scale=2, user-scalable=yes" />
		<!-- First-paint values (paper, light and dark); useSystemBarColors keeps them live afterwards. -->
		<meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)" />
		<meta
			name="description"
			content="WizCol helps communities turn different views into decisions they can stand behind."
		/>
		<link rel="icon" type="image/png" href="/favicon.png?v=141e250a" />
		<link rel="apple-touch-icon" href="/icons/logo-192px.png" />
		<link rel="manifest" href="/manifest.json" />
		<title>WizCol · Find a way forward. Together.</title>

		<meta property="og:type" content="website" />
		<meta property="og:title" content="WizCol · Find a way forward. Together." />
		<meta
			property="og:description"
			content="Turn different views into decisions your community can stand behind."
		/>
		<meta property="og:image" content="https://wizcol.com/icons/logo-512px.png" />
		<meta property="og:url" content="https://wizcol.com" />
		<meta property="og:site_name" content="WizCol" />
		<meta name="twitter:card" content="summary_large_image" />

		<style>
			:root {
				color-scheme: light dark;
				font-family: Arial, Helvetica, sans-serif;
				background: #fbfaf7;
			}
			* {
				box-sizing: border-box;
			}
			html,
			body,
			#root {
				width: 100%;
				height: 100%;
				margin: 0;
			}
			body {
				overflow: hidden;
			}
			/* Literal colours: no stylesheet has loaded yet. They must equal the two
			   theme-color metas above (#fbfaf7 light, #0b0f17 dark): no colour jump at first paint. */
			#initial-loader {
				display: grid;
				width: 100%;
				height: 100%;
				place-items: center;
				background: #fbfaf7;
				color: #171816;
			}
			#initial-loader span {
				font-size: clamp(2rem, 7vw, 4rem);
				font-weight: 800;
				letter-spacing: -0.06em;
				animation: breathe 900ms ease-in-out infinite alternate;
			}
			@keyframes breathe {
				to {
					opacity: 0.55;
					transform: scale(0.97);
				}
			}
			@media (prefers-color-scheme: dark) {
				:root {
					background: #0b0f17;
				}
				#initial-loader {
					background: #0b0f17;
					color: #f6efff;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#initial-loader span {
					animation: none;
				}
			}
		</style>
	</head>
	<body>
		<div id="root">
			<div id="initial-loader" role="status" aria-label="Loading WizCol">
				<span>WizCol.</span>
			</div>
		</div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
